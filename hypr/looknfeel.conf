# Change the default Omarchy look'n'feel

# https://wiki.hypr.land/Configuring/Basics/Variables/#general
general {
    # Chonk look, layered over Omarchy defaults and current theme colors.
    gaps_in = 2
    gaps_out = 4
    border_size = 2
    resize_on_border = true

    # Keep Omarchy's current default layout unless explicitly changed.
    # layout = scrolling
}

# https://wiki.hypr.land/Configuring/Basics/Variables/#decoration
decoration {
    rounding = 4

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }

    # Dim unfocused windows (0.0 = no dim, 1.0 = fully dimmed)
    # dim_inactive = true
    # dim_strength = 0.15
}

# https://wiki.hypr.land/Configuring/Basics/Variables/#animations
animations {
    enabled = false
}

# https://wiki.hypr.land/Configuring/Basics/Variables/#cursor
cursor {
    # Keep the pointer visible on desktop; Omarchy defaults hide it after keypress.
    hide_on_key_press = false
}

# https://wiki.hypr.land/Configuring/Basics/Variables/#layout
layout {
    # Avoid overly wide single-window layouts on wide screens
    # single_window_aspect_ratio = 1 1
}
